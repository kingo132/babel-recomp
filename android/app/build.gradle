plugins {
    id 'com.android.application'
}

def chineseRom = project.hasProperty("chineseBuild")

// The native side is the game's own CMake project (two levels up), built as
// libmain.so with SDL3 linked in statically.
android {
    namespace = "com.mr0ta.babelrecomp"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"
    defaultConfig {
        applicationId (chineseRom ? (project.hasProperty("qaBuild") ? "local.gaia.flippad.cn.qa" : "local.gaia.flippad.cn") : (project.hasProperty("qaBuild") ? "local.gaia.flippad.qa" : "local.gaia.flippad"))
        minSdkVersion 24
        targetSdkVersion 35
        versionCode (chineseRom ? 5 : 4)
        versionName (chineseRom ? "0.3.0" : "0.2.2")
        resValue "bool", "chinese_rom", chineseRom ? "true" : "false"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static",
                          "-DCMAKE_BUILD_TYPE=Release", "-DSNESRECOMP_TOUCH_PAD=OFF", "-DSNESRECOMP_BUILD_VERSION=1.0-FlipPad-${chineseRom ? '0.3.0-CN' : '0.2.2'}",
                          "-DIOG_CHINESE_ROM=${chineseRom ? 'ON' : 'OFF'}",
                          "-DIOG_ROM_IDENTITY_FILE=${file(chineseRom ? '../../rom_identity_cn.txt' : '../../rom_identity.txt')}"
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug   // sign your own for distribution
        }
    }
    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.31.6'
        }
    }
    lint {
        abortOnError = false
    }
    sourceSets.main.assets.srcDirs = ["$buildDir/bundled", "src/main/assets"]
}

// The data files the desktop build stages beside the executable, bundled
// into the APK (BabelActivity copies them to the app's files folder).
def repo = file('../..')
tasks.register('bundleGameFiles', Sync) {
    into "$buildDir/bundled"
    from("$repo/recomp-ui/assets/common") { into 'assets' }
    from("$repo/recomp-ui/assets/consoles/snes") { into 'assets'; exclude '*.json', '*.md' }
    from("$repo/i18n") { into 'i18n' }
    if (!chineseRom) from("$repo/mods/preloaded/packages") { into 'mods/preloaded/packages' }
}
preBuild.dependsOn bundleGameFiles

// Optional private build input: never stored in the source archive.
if (project.hasProperty('gaiaRom')) {
    tasks.named('bundleGameFiles', Sync) {
        from(project.property('gaiaRom')) { into 'private'; rename { 'rom.sfc' } }
    }
}
